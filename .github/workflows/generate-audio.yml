name: Generate audio (ElevenLabs)

# Run manually from the Actions tab. Needs a repository secret named
# ELEVENLABS_API_KEY (Settings → Secrets and variables → Actions).
# Optional repository variables: ELEVENLABS_VOICE_A, ELEVENLABS_VOICE_B, ELEVENLABS_MODEL.

on:
  workflow_dispatch:
    inputs:
      modes:
        description: 'Modes to generate: natural, slow, words (comma-separated)'
        default: 'natural'
        required: true
      limit:
        description: 'Max clips this run (empty = all)'
        default: ''
        required: false
      dry_run:
        description: 'Only show the credit estimate'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: generate-audio
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate clips
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_A: ${{ vars.ELEVENLABS_VOICE_A }}
          ELEVENLABS_VOICE_B: ${{ vars.ELEVENLABS_VOICE_B }}
          ELEVENLABS_MODEL: ${{ vars.ELEVENLABS_MODEL }}
          MODES: ${{ inputs.modes }}
          LIMIT: ${{ inputs.limit }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--modes="$MODES")
          if [ -n "$LIMIT" ]; then args+=(--limit="$LIMIT"); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          node scripts/generate-audio.mjs "${args[@]}"

      - name: Commit new clips
        if: ${{ !inputs.dry_run }}
        env:
          MODES: ${{ inputs.modes }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio
          if git diff --cached --quiet; then
            echo "No new audio."
          else
            git commit -m "Generate audio with ElevenLabs ($MODES)"
            git push
          fi
